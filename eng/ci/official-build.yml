variables:
  Codeql.Enabled: true
  coreToolsVersion: "4.2.2-1"

# Enable CI on branches master and dev
# Batch builds
trigger:
  batch: true
  branches:
    include:
      - master

schedules:
  - cron: "0 12 * * 0"
    displayName: Weekly Sunday build
    branches:
      include:
        - master
    always: true

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-22.04
      os: linux
    sdl:
      sourceAnalysisPool:
        name: 1es-pool-azfunc
        image: 1es-windows-2022
        os: windows
    stages:
      - stage: stage1
        displayName: Build in Linux VM
        jobs:
          - job: job1
            displayName: Build Kafka Extension
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)
                  artifactName: drop
            steps:
              - task: NuGetAuthenticate@1
                displayName: Authenticate NuGet feed

              - task: npmAuthenticate@0
                displayName: Authenticate npm to CFS
                inputs:
                  workingFile: .npmrc

              - task: UseDotNet@2
                displayName: "Install .NET Core SDK"
                inputs:
                  version: 3.1.x
                  packageType: sdk

              - task: UseDotNet@2
                displayName: "Install .NET 6.0"
                inputs:
                  version: 6.x
                  packageType: sdk

              - task: UseDotNet@2
                displayName: "Install .NET 8.0"
                inputs:
                  version: 8.x
                  packageType: sdk

              - task: DotNetCoreCLI@2
                displayName: Restore projects
                inputs:
                  command: restore
                  projects: |
                    src/Microsoft.Azure.WebJobs.Extensions.Kafka/Microsoft.Azure.WebJobs.Extensions.Kafka.csproj
                    test/Microsoft.Azure.WebJobs.Extensions.Kafka.UnitTests/Microsoft.Azure.WebJobs.Extensions.Kafka.UnitTests.csproj
                    test/Microsoft.Azure.WebJobs.Extensions.Kafka.EndToEndTests/Microsoft.Azure.WebJobs.Extensions.Kafka.EndToEndTests.csproj
                    test/Microsoft.Azure.WebJobs.Extensions.Kafka.LangEndToEndTests/Microsoft.Azure.WebJobs.Extensions.Kafka.LangEndToEndTests.csproj
                  feedsToUse: config
                  nugetConfigPath: '$(Build.SourcesDirectory)/NuGet.config'

              - task: DotNetCoreCLI@2
                displayName: Build project
                inputs:
                  command: "build"
                  arguments: "--configuration Release --no-restore -p:IsLocalBuild=False"
                  projects: src/Microsoft.Azure.WebJobs.Extensions.Kafka/Microsoft.Azure.WebJobs.Extensions.Kafka.csproj

              - task: DotNetCoreCLI@2
                displayName: Build test projects
                inputs:
                  command: "build"
                  arguments: "--configuration Release --no-restore -p:IsLocalBuild=False"
                  projects: |
                    test/Microsoft.Azure.WebJobs.Extensions.Kafka.UnitTests/Microsoft.Azure.WebJobs.Extensions.Kafka.UnitTests.csproj
                    test/Microsoft.Azure.WebJobs.Extensions.Kafka.EndToEndTests/Microsoft.Azure.WebJobs.Extensions.Kafka.EndToEndTests.csproj
                    test/Microsoft.Azure.WebJobs.Extensions.Kafka.LangEndToEndTests/Microsoft.Azure.WebJobs.Extensions.Kafka.LangEndToEndTests.csproj

              - task: Bash@3
                displayName: "Installing Core tools"
                inputs:
                  targetType: inline
                  script: |
                    sudo apt-get install azure-functions-core-tools-4=$(coreToolsVersion)

              # Maven resolves plugins before pom.xml repositories are honored; install the
              # mirror settings first, then authenticate, so all resolution goes through CFS.
              - pwsh: |
                  $m2 = Join-Path $HOME '.m2'
                  New-Item -ItemType Directory -Path $m2 -Force | Out-Null
                  Copy-Item '$(Build.SourcesDirectory)/test/Microsoft.Azure.WebJobs.Extensions.Kafka.LangEndToEndTests/FunctionApps/java/settings.xml' (Join-Path $m2 'settings.xml') -Force
                displayName: "Install Maven settings.xml for CFS"

              - task: MavenAuthenticate@0
                displayName: "Authenticate Maven to CFS"
                inputs:
                  artifactsFeeds: upstream-public

              - pwsh: |
                  cd ./test/Microsoft.Azure.WebJobs.Extensions.Kafka.LangEndToEndTests/FunctionApps/java/Confluent
                  mvn clean package `-Dmaven`.javadoc`.skip=true `-Dmaven`.test`.skip `-Dorg`.slf4j`.simpleLogger`.log`.org`.apache`.maven`.cli`.transfer`.Slf4jMavenTransferListener=warn `-B
                  cd ../EventHub
                  mvn clean package `-Dmaven`.javadoc`.skip=true `-Dmaven`.test`.skip `-Dorg`.slf4j`.simpleLogger`.log`.org`.apache`.maven`.cli`.transfer`.Slf4jMavenTransferListener=warn `-B
                displayName: "Package Java Functions for Codeql"

              - task: DotNetCoreCLI@2
                displayName: Run unit tests
                inputs:
                  command: test
                  projects: ./test/Microsoft.Azure.WebJobs.Extensions.Kafka.UnitTests
                  arguments: '--configuration Release --no-build --no-restore'

              - template: ci/sign-files.yml@eng
                parameters:
                  displayName: Sign extension assembly
                  folderPath: src/Microsoft.Azure.WebJobs.Extensions.Kafka/bin/Release/netstandard2.0/
                  pattern: Microsoft.Azure.WebJobs.Extensions.Kafka.dll
                  signType: dll

              - task: DotNetCoreCLI@2
                displayName: Pack NuGet package
                inputs:
                  command: pack
                  packDirectory: "$(Build.ArtifactStagingDirectory)"
                  searchPatternPack: src/Microsoft.Azure.WebJobs.Extensions.Kafka/Microsoft.Azure.WebJobs.Extensions.Kafka.csproj
                  configurationToPack: Release
                  includesymbols: true
                  nobuild: true

              - template: ci/sign-files.yml@eng
                parameters:
                  displayName: Sign extension package
                  folderPath: $(Build.ArtifactStagingDirectory)
                  pattern: Microsoft.Azure.WebJobs.Extensions.Kafka.*.nupkg
                  signType: nuget
